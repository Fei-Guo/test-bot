name: E2E Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install SQLite dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libsqlite3-dev

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: CGO_ENABLED=1 go test -v ./...

    - name: Build server
      run: CGO_ENABLED=1 go build -o model-server .

    - name: Run E2E tests
      run: |
        CGO_ENABLED=1 ./model-server &
        SERVER_PID=$!
        sleep 2
        
        echo "=== Testing /metrics endpoint (initial state) ==="
        curl -s http://localhost:8080/metrics | grep -E "models_(created|read|updated|deleted)_total"
        
        echo ""
        echo "=== Creating models ==="
        curl -s -X POST http://localhost:8080/api/models \
          -H "Content-Type: application/json" \
          -d '{"name": "gpt-4", "url": "https://api.openai.com/v1/models/gpt-4"}'
        echo ""
        
        curl -s -X POST http://localhost:8080/api/models \
          -H "Content-Type: application/json" \
          -d '{"name": "claude-3", "url": "https://api.anthropic.com/v1/models/claude-3"}'
        echo ""
        
        echo ""
        echo "=== Testing /metrics after creates (models_created_total should be 2) ==="
        curl -s http://localhost:8080/metrics | grep "models_created_total" | grep -v "#"
        
        echo ""
        echo "=== Testing GET /api/models (list) ==="
        curl -s http://localhost:8080/api/models | jq .
        
        echo ""
        echo "=== Testing GET /api/models/gpt-4 (get single) ==="
        curl -s http://localhost:8080/api/models/gpt-4 | jq .
        
        echo ""
        echo "=== Testing /metrics after reads (models_read_total should be 2) ==="
        curl -s http://localhost:8080/metrics | grep "models_read_total" | grep -v "#"
        
        echo ""
        echo "=== Testing PUT /api/models/gpt-4 (update) ==="
        curl -s -X PUT http://localhost:8080/api/models/gpt-4 \
          -H "Content-Type: application/json" \
          -d '{"name": "gpt-4", "url": "https://api.openai.com/v1/models/gpt-4-turbo"}'
        echo ""
        
        echo ""
        echo "=== Testing /metrics after update (models_updated_total should be 1) ==="
        curl -s http://localhost:8080/metrics | grep "models_updated_total" | grep -v "#"
        
        echo ""
        echo "=== Testing DELETE /api/models/claude-3 ==="
        curl -s -X DELETE http://localhost:8080/api/models/claude-3 -w "\nStatus: %{http_code}\n"
        
        echo ""
        echo "=== Testing /metrics after delete (models_deleted_total should be 1) ==="
        curl -s http://localhost:8080/metrics | grep "models_deleted_total" | grep -v "#"
        
        echo ""
        echo "=== All E2E tests passed! ==="
        
        # Cleanup
        kill $SERVER_PID
        rm -f models.db
