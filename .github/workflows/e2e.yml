name: E2E Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install SQLite dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libsqlite3-dev

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: CGO_ENABLED=1 go test -v ./...

    - name: Build server
      run: CGO_ENABLED=1 go build -o model-server .

    - name: Run E2E tests
      run: |
        CGO_ENABLED=1 ./model-server &
        SERVER_PID=$!
        sleep 2
        
        # Create models
        curl -s -X POST http://localhost:8080/api/models \
          -H "Content-Type: application/json" \
          -d '{"name": "gpt-4", "url": "https://api.openai.com/v1/models/gpt-4"}'
        
        curl -s -X POST http://localhost:8080/api/models \
          -H "Content-Type: application/json" \
          -d '{"name": "claude-3", "url": "https://api.anthropic.com/v1/models/claude-3"}'
        
        # List and verify
        curl -s http://localhost:8080/api/models | jq . | grep "gpt-4"
        
        # Cleanup
        kill $SERVER_PID
        rm -f models.db
        
        echo "E2E tests passed!"
